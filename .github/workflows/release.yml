name: tests and release

# Pushes and pull requests run the tests.
# A tag host-v<version> publishes the host release, extension-v<version> the extension release.
# Each release carries only its own archive and only the changelog section of that version.
on:
  push:
    branches: [main]
    tags: ['host-v*', 'extension-v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Tests
        run: python -m unittest discover -s tests -v

      - name: Installer scripts parse
        shell: powershell
        run: |
          foreach ($f in 'install.ps1', 'uninstall.ps1', 'make-release.ps1') {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$null, [ref]$errors)
            if ($errors.Count) { $errors; exit 1 }
          }

      - name: Build both archives (check)
        if: "!startsWith(github.ref, 'refs/tags/')"
        shell: powershell
        run: |
          ./make-release.ps1 host
          ./make-release.ps1 extension

      - name: Build the tagged release
        if: startsWith(github.ref, 'refs/tags/')
        id: build
        shell: bash
        run: |
          tag="$GITHUB_REF_NAME"
          component="${tag%%-v*}"          # host | extension
          version="${tag#*-v}"
          powershell -NoProfile -ExecutionPolicy Bypass -File make-release.ps1 "$component"
          built="$(cat release/version.txt)"
          if [ "$built" != "$version" ]; then
            echo "Tag $tag does not match the $component version $built"; exit 1
          fi
          if [ "$component" = host ]; then
            title="Host $version"; latest=true
          else
            title="Расширение $version"; latest=false
          fi
          echo "title=$title" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Host releases stay "Latest", so releases/latest always leads to the host.
          gh release create "$GITHUB_REF_NAME" release/*.zip release/*.sha256 \
            --title "${{ steps.build.outputs.title }}" --notes-file release/notes.md \
            --latest=${{ steps.build.outputs.latest }}
